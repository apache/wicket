<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org">
<head>
    <title>Wicket Examples - component reference</title>
</head>
<body>
    <wicket:extend>

	<h1><wicket:message key="page.title">A component with more than one model</wicket:message></h1>
	<wicket:link><a href="Index.html">[back to the reference]</a></wicket:link>

	<p><wicket:message key="page.intro">What this page shows.</wicket:message></p>

	<div wicket:id="card">customer card</div>

	<p>
	<wicket:message key="select.customer">Show the card of:</wicket:message>
	<span wicket:id="customers"><a wicket:id="select">customer</a> </span>
	</p>

	<p>
	<wicket:message key="replace.orders">Replace the orders model:</wicket:message>
	<a wicket:id="unpaidOnly"><wicket:message key="link.unpaidOnly">unpaid orders only</wicket:message></a> |
	<a wicket:id="allOrders"><wicket:message key="link.allOrders">all orders</wicket:message></a>
	</p>

    <div wicket:id="explainPanel">explanation goes here</div>

</wicket:extend>
</body>
</html>
