title=Icons
description=The icons of wicket-extensions: built in, SvgIcon and FontAwesomeIcon
explanation=Every icon is an IIcon, which renders its markup itself. SvgIcon draws the solid icons of Font Awesome Free as inline SVG, read from the Font Awesome web jar the application puts on its class path, and needs no style sheet or font. FontAwesomeIcon draws the same icons with the Font Awesome font, whose style sheet the page has to load; this example serves it from the web jar. IconBasedRowAction.Icon holds the few icons the table's actions use by default. Choose a set, type to filter the icons by name and click an icon to copy its Java constant.
