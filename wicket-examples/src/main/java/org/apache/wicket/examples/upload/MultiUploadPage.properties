title=Multiple File Upload
explanation=<p>The multi upload field is based on javascript found <a target="_blank" href="http://the-stickman.com/web-development/javascript/upload-multiple-files-with-a-single-file-element/">here</a>.<br /><br /> Wicket can also handle file uploads via AJAX, please see AJAX examples section. AJAX Functionality is not included in this example to keep things simple.</p> <p>The maximum file size of a single upload is: 90k!</p> <p>The maximum size of uploading several files (third demo) is: 100k!</p>
order=2
simpleUpload.uploadTooLarge = File must be less than ${maxSize}.
simpleUpload.uploadSingleFileTooLarge = Each of files must be less than ${fileMaxSize}.
simpleUpload.uploadFailed = File failed to upload: ${exception.localizedMessage}
