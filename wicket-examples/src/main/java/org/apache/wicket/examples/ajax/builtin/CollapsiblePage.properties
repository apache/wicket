title=Collapsible Panel
description=a title and a body the user can expand and collapse
explanation=<p>The CollapsiblePanel component from wicket-extensions renders the native details and summary elements: expanding and collapsing works without JavaScript, with the keyboard, and under a strict Content Security Policy. The first panel is collapsed, as panels are by default, the second one is rendered expanded. The third one reports every toggle via Ajax, so the server knows its state and keeps it when the page is rendered again: reload the page to see. Its body is a form. All three take their colors from the theme chosen above.</p>
collapsed.title=Collapsed by default
collapsed.body=This text was hidden until you expanded the panel.
expanded.title=Expanded
expanded.body=This panel was rendered expanded with setExpanded(true).
remembered.title=Remembers whether it is expanded
