title=ArrangeableDataTable Example
description=demonstrates a data table whose columns the user can resize and move
explanation=An ArrangeableDataTable is a DataTable whose columns the user arranges:<br/> <ul> <li>Drag the right edge of a header to resize its column, or focus that edge and use the left and right arrow keys. The table becomes as wide as its columns: a ResizableColumnsBehavior in STRETCH mode</li> <li>Drag the dotted handle in front of a header to move its column, a marker showing where it lands, or focus the handle and use the arrow keys: a MovableColumnsBehavior. The ID column is not an IMovableColumn, so it keeps its place and no column can be moved in front of it</li> <li>The table keeps the order and the widths of its columns on the server: a move renders the table again via Ajax with the widths the user chose, and sorting or paging keeps them</li> </ul>
