<html xmlns="http://www.w3.org/1999/xhtml" xmlns:wicket="http://wicket.apache.org">
<head>
    <title>Wicket Examples - customer card</title>
</head>
<body>
 <wicket:panel>

	<p class="panel">
		<b><span wicket:id="title">title</span></b>:
		<span wicket:id="name" class="mark">customer name</span>
	</p>

	<table>
		<tr>
			<th><wicket:message key="orders.number">Order</wicket:message></th>
			<th><wicket:message key="orders.amount">Amount</wicket:message></th>
			<th><wicket:message key="orders.status">Status</wicket:message></th>
		</tr>
		<tr wicket:id="orders">
			<td><span wicket:id="number">number</span></td>
			<td><span wicket:id="amount">amount</span></td>
			<td><span wicket:id="status">status</span></td>
		</tr>
	</table>

	<p>
		<wicket:message key="unpaid.total">Unpaid total:</wicket:message>
		<span wicket:id="unpaidTotal" class="mark">0</span>
	</p>

	<p wicket:id="orderLoads">how often the orders were loaded</p>

	<p><wicket:message key="models.header">getModels() of this panel:</wicket:message></p>
	<ul>
		<li wicket:id="models"><span wicket:id="model">model</span></li>
	</ul>

 </wicket:panel>
</body>
</html>
