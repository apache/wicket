title=World Clock Example
description=demonstrates a single component with AjaxTimerBehavior updating multiple components
explanation=This example demonstrates a AjaxTimerBehavior as well as updating of multiple components on the page. <br/> This AjaxTimerBehavior can be attached to any component and will recieve a callback every x number of milliseconds. Within this callback it is very simple to update any number of components via ajax.
