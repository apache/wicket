title=LazyLoading Example
description=demonstrates lazy loading of components.
explanation=<p> This example demonstrates the AjaxLazyLoadPanel It will lazy load a panel after the page is first fully rendered. So panels that can take a while too create can be lazy created by an ajax call after the page is rendered. </p>
