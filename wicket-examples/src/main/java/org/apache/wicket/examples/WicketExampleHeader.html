<?xml version="1.0" encoding="UTF-8" ?>
<html xmlns:wicket="http://wicket.apache.org">
<body>
  <wicket:panel>
    <div class="header default">
        <div class="l-container">
            <div class="logo">
                <a href="index.html" target="_top"><img wicket:id="exampleheaderimage" alt="Apache Wicket" /></a>
            </div>
            <div class="ajax-engine">
                Ajax engine: <strong wicket:id="ajaxEngine">jQuery</strong>
                (<a wicket:id="toggleAjaxEngine">switch to <span wicket:id="toggleAjaxEngineLabel">Plain JavaScript</span></a>)
            </div>
        </div>
        <div wicket:id="debug"></div>
    </div>
  </wicket:panel>
</body>
</html>
