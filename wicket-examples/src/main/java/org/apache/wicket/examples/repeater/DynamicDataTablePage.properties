title=DynamicDataTable Example
description=demonstrates a table rendered in the browser from JSON
explanation=This is a demo of the DynamicDataTable. Wicket renders only the table and its header; the rows are fetched as JSON and rendered in the browser from per-column templates.<br/> <ul> <li>"Add a contact" adds a contact named Aaron, who is listed first, without re-rendering the table: the server pushes a refresh message over the page's web socket connection, and the table fetches its rows again</li> <li>Most columns read their template from an .html file next to the page, found like a panel's markup: IdColumn.html, FirstNameColumn.html, LastNameColumn.html, AddressColumn.html and PhonesColumn.html. Switching to German picks the _de variants where they exist, and the headers come from the page's properties</li> <li>"Push the rows" sends the rows of the current page, in reverse order, as JSON over the web socket connection, and the table repaints them in the browser without any request to the server. The server always serves the rows sorted by first name, so the reversed order can only have come from the push; a refresh restores it</li> <li>The edit, delete and download buttons are IconBasedRowActions: plain markup, not components, with their tooltip as title. A click goes to the table, which looks the row up by its key and hands it to the action registered for the button</li> <li>The pencil opens a form in a FloatingPanel, shown in the table's overlay: a window with a title bar in the colors of the table's headings, over a veil that blocks the table until the form is saved, cancelled or closed. The overlay covers the whole page here, its window in the middle of the browser window; "Edit form and confirmation" above shows it over the table instead. Escape closes it too, but only while nothing in the form was changed. Every field is required; the address column shows the street, city and country in one line, the form edits them separately. Saving updates the contact and repaints the rows</li> <li>The bin asks to confirm the deletion in the same overlay before it deletes the contact</li> <li>While a request of the table runs, for example saving, deleting or paging, a veil blocks the table and, if it takes a while, shows a spinner in the theme's colors. The hourglass in the navigation runs a slow action, which takes two seconds on the server, to show it</li> <li>The body of the table is 800 pixels high and scrolls, while the headers, the toolbars above them and the navigation below stay in view; a page with fewer rows leaves the rest empty, so the table keeps its height. "Body height" and its unit above change it: pixels, percent of the window's height, or percent of the parent's height, which needs a parent with a height of its own and is as high as the rows here; a negative height lets the body take the height of its rows</li> <li>Double-click a phone number to copy it to the clipboard: a ClipboardCopyBehavior script copies it and shows a check mark on it. Whatever is typed into the form, such as markup or script in a name, is shown as text everywhere</li> <li>The download button saves the contact as a jCard (RFC 7095), the JSON form of the vCard format address books exchange contacts in, through an AjaxDownloadActionColumnContributor shown as an icon: the browser fetches the file itself and hands it to its own download manager. Each row's element carries an id made of the table's id and the row key, so a row keeps its identity whatever happens to the rows around it</li> <li>The Progress column is a ProgressBarColumn, whose cells are the markup of the ProgressBar component, striped and moving. While the page is open, a timer of its own advances the progress of random contacts among those the page shows every 100 ms, and pushes the changed rows over the web socket connection at most every 500 ms; each push repaints only its row. The table reports the rows it sends to the browser, so rows on other pages are neither advanced nor pushed. Clicks keep working while the rows repaint, because they are dispatched by the row key</li> <li>The first, last name and born columns sort the rows when their header is clicked, the highlighted arrow showing the order. Sorting queries the contacts again on the server, shows the first page, repaints every row and clears the selection; the # column numbers the rows across pages, and the navigation is shown above and below the table</li> <li>Columns can be resized by dragging the right edge of a header, or with the arrow keys on that edge. While dragging, a line with arrows shows where the edge will land, a shaded band the new extent of the column and a label its width in pixels. The columns are resizable because the page added a ResizableColumnsBehavior to the table, and the table grows with them; the "Columns" option above adds or removes it. The selection, #, Actions and ID columns cannot be resized. Each resize is sent to the server, which renders the table with the same widths next time</li> <li>The table takes the full width of the page, sharing it among the columns by their content; "Width" switches to a table as wide as its columns. "Proportions" lets the page set the relative widths of the columns instead. While no column has been resized, a full-width table follows the size of the window</li> <li>The options above also place the navigation and the selection bar on top, at the bottom or both, and choose the theme: the colors of the table, its progress bars and this explanation come from a theme of wicket-extensions, switched by a CSS class only. The rows per page can be chosen in the navigation</li> <li>The database of this example holds a thousand contacts. The text field in front of the navigation filters them by first and last name as you type; it is a component the example plugs into the navigation, not a feature of the table</li> <li>The download button after the paging links exports the selected contacts as a CSV file, or all of them if none is selected, through a CsvExportToolbarAction</li> <li>The checkboxes of the first column select rows; the selection is kept on the server, by key, so it survives paging, sorting and pushes. The header checkbox selects the page and shows whether all, some or none of its rows are selected. Once the whole page is selected, a bar below the top navigation offers to select every contact; checking or unchecking a row afterwards turns the selection back into the rows the page shows checked. The line below the table shows what the server holds</li> <li>Editing a contact also selects it and shows it in the details panel below the table</li> <li>Delete a contact in one tab and click it in another: the click still reaches the table, which reports that the contact is gone instead of failing with a missing component</li> <li>The plus in the navigation is an IconBasedToolbarAction: it opens the same form as the pencil, empty, and adds the contact it is saved with</li> <li>"Icons" switches the icons of the actions between the built-in ones, SvgIcon, the solid icons of Font Awesome as inline SVG read from its web jar, which need no style sheet or font, and FontAwesomeIcon, the same icons drawn by the Font Awesome font, which the page loads from its web jar. Every icon is an IIcon</li> <li>The button with the columns in the navigation is a ColumnChooserToolbarAction: it lists the columns implementing IHideableColumn, those after ID, with a tick on those shown. Click a column to tick or untick it and apply to show the ticked ones; Home phone, Cell phone, City and Country are hidden at first</li> <li>The page added a MovableColumnsBehavior to the table, and the columns after ID implement IMovableColumn: drag the dotted handle in front of their title, with the mouse, a pen or a finger, and drop the column between two others, a line with arrows showing where it will land, or move it with the arrow keys on the handle. The selection, #, Actions and ID columns keep their places, so no marker is shown where the column would move one of them. After a move the table is rendered again with its rows, without fetching them</li> <li>The table remembers the order, the visibility and the widths of its columns in its column state store, the session by default: reload the page and the columns are as you left them. "Column state" switches to a store of this example keeping the states in a file of the temporary directory, which survives restarts of the server; an application would keep them in its database, by user, through an IColumnStateStore of its own. "Reset the columns" brings back the order, visibility and widths the page starts with</li> </ul>
