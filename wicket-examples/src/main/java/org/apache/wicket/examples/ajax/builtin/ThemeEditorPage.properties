title=Theme editor
description=edits the colors of a theme of wicket-extensions, with a live preview
explanation=The themes of wicket-extensions are CSS classes setting the custom properties --wicket-theme-*, which the style sheets of the components read. Start from one of the themes, change its colors with the pickers on the left and watch the components on the right follow: progress bars, a collapsible panel, tabs with a TabsStyleBehavior, the suggestions of an auto-complete field and a modal dialog. The text area below the pickers holds the CSS class defining your theme; put it into your style sheet and the classes wicket-theme and yours on a page or a component, and the components inside take its colors; wicket-theme marks the element as themed, as ThemeBehavior does for the built-in themes. The changes are made in the browser through the CSS object model, so the page needs no inline style and keeps working under the strict Content Security Policy of the examples.
