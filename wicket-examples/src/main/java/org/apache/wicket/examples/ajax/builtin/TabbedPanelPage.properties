title=Tabbed Panel Example
description=demonstrates ajax enabled tabbed panel
explanation=An AjaxTabbedPanel switching its tabs via Ajax. A TabsStyleBehavior gives it one of the looks of TabsStyle: tabs joined to the panel, pills, or underlined titles, all in the colors of the theme chosen above. "Classic" leaves the tabs to the CSS of the examples, as without the behavior.
style=Style
style.nullValid=Classic
TabsStyle.TABS=Tabs
TabsStyle.PILLS=Pills
