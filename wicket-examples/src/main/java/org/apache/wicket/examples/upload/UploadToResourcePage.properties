title=Multiple (AJAX) Upload to a Resource
explanation=<p>Wicket can upload to a <em>mounted resource.</em></p> <p>This upload is done with a plain XMLHttpRequest and <em>does not</em> block Wicket AJAX</p> <p>Files chosen several times or dropped on the zone add up in a list, from which each can be removed before the upload</p> <p>The limits of the field, 100 KB in all, 90 KB a file and 5 files, are checked before anything is sent: files beyond them are refused without being uploaded</p> <p>Files of the same name are kept apart: each is stored under a name of its own, which the message after the upload shows</p> <p><em>Upload progressbar</em> has been updated to work with this component</p>
order=3
