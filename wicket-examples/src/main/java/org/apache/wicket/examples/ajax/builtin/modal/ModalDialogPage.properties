title=Modal dialog
description=javascript modal dialog example
explanation=Dialogs opened with ModalDialog, nested in each other or stacked next to each other. The dialogs use the DefaultTheme behavior, which follows the theme chosen above: the overlay dims with the theme's veil, the dialog takes its surface, text and border colors, and the content's modal-dialog-header, modal-dialog-body and modal-dialog-footer classes give it a header in the theme's primary colors and a footer in its toolbar color. Without a theme the dialog keeps its plain look.
