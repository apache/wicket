<wicket:extend xmlns:wicket="http://wicket.apache.org">

<p>
 <a href="#" wicket:id="addContact">Add a contact and refresh the table via web sockets</a> |
 <a href="#" wicket:id="pushRows">Push the rows of this page in reverse order via web sockets</a> |
 <a href="#" wicket:id="switchLocale">[language]</a>
</p>
<div wicket:id="options" class="dynamic-dataview-options">
 <label><wicket:message key="resize"/> <select wicket:id="resize"></select></label>
 <label><wicket:message key="width"/> <select wicket:id="width"></select></label>
 <label><wicket:message key="proportions"/> <select wicket:id="proportions"></select></label>
 <label><wicket:message key="navigation"/> <select wicket:id="navigation"></select></label>
 <label><wicket:message key="selectionBar"/> <select wicket:id="selectionBar"></select></label>
 <label><wicket:message key="icons"/> <select wicket:id="icons"></select></label>
 <label><wicket:message key="columnState"/> <select wicket:id="columnState"></select></label>
 <a href="#" wicket:id="resetColumns"><wicket:message key="resetColumns"/></a>
</div>
<div>
<div>
 <table class="dynamic-dataview" cellspacing="0" wicket:id="table">[table]</table>
</div>
<p wicket:id="selection" class="dynamic-dataview-selection">[selection]</p>
</div>
<div wicket:id="details">[details]</div>
</wicket:extend>
