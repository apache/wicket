title=Resumable upload to a resource
explanation=<p>Each file goes to a <em>mounted resource</em> in chunks of 1 MB, over the open <a href="https://tus.io/protocols/resumable-upload">tus protocol</a>.</p> <p>Pause, resume or cancel each upload, or all of them at once. Two files are sent at the same time, the others wait.</p> <p>When the connection breaks off for a moment, the upload goes on by itself from where the server got. When it stays lost for longer, a VPN that went down for example, the page asks whether to resume the uploads once the server answers again.</p> <p>Reload the page in the middle of an upload: the page lists the uploads that did not end and asks whether to go on with them, which they do from where they were once you choose their files again.</p> <p>Once a file is whole it is stored by the same file manager as the other upload to a resource, and the page hears of it the same way.</p> <p>The grants of the page, the id of its field and the limits of its uploads, are signed with a key of the application, <code>HmacGrantSigner.random()</code>, rather than one of the session: with uploads that belong to the signed-in user, see <code>getCurrentOwner()</code>, a page goes on with them after its session expired. A page whose grant the server no longer takes asks to be reloaded, and the page reloaded offers to go on with the uploads.</p> <p>The application knows you by a cookie that lasts a week, as an application with users knows the signed-in user, and keeps track of your uploads: the list below the files shows them. Come back in another session, after closing the browser for example: the page offers to go on with the uploads you left unfinished, wherever you started them, and a file stored that no page took can be taken from the list, as a step of a wizard would.</p>
order=4
