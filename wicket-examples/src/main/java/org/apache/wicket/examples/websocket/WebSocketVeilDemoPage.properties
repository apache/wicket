title=Veil a component while the server recomputes it
description=raises a local veil from the server and lifts it with the pushed update.
explanation=<p> "Start pushes" starts a background task bound to this page. Ten times, it tells the browser through the WebSocket connection that the counter panel is being recomputed, which raises the panel's LocalVeilBehavior, works for a while, and pushes the new counter. The update lifts the veil. Odd rounds take 3 s: the spinner shows after 300 ms, a progress update halfway through redraws the panel, which stays veiled, and the spinner goes away with the final update. Even rounds take 600 ms: the spinner shows after 300 ms, and since the update arrives within its minimum time of 500 ms, it stays on the redrawn panel until 800 ms. The rest of the page stays usable throughout. </p><p> "Slow request with a stray unveil" sends an Ajax request from inside the panel. While it runs, the server sends an unveil message without a preceding veil message, as happens when the veil message went out before the WebSocket connection was open. The browser ignores it, and the request keeps its veil. </p>
