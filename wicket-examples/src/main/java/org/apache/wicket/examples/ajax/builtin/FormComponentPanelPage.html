<?xml version="1.0" encoding="UTF-8" ?>
<wicket:extend xmlns:wicket="http://wicket.apache.org">

This example demonstrates a AjaxFormComponentUpdatingBehavior in combination with a FormComponentPanel.

Whenever the input numbers are changed it will submit the new value to the server via Ajax and update the result.

<br/><br/>
<form wicket:id="form">
	<span wicket:id="multiply">[multiply]</span>
	= <span wicket:id="multiplyLabel">[result]</span>
</form>
</wicket:extend>
