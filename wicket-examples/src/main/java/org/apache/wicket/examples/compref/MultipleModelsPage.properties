page.title=A component with more than one model
page.intro=A component has one default model, which the framework detaches at the end of every \
request. Since Wicket 11 a component can register further models next to it with \
addAdditionalModel, and they are detached together with the default model. The panel below uses \
four models and does not override onDetach at all.
select.customer=Show the card of:
replace.orders=Replace the orders model through a setter, which uses replaceAdditionalModel to \
detach and unregister the previous one:
link.unpaidOnly=unpaid orders only
link.allOrders=all orders
