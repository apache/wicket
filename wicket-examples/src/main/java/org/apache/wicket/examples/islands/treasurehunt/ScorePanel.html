<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
	<div class="treasure-score">
		<p>Your score: <strong wicket:id="score"></strong></p>
		<div wicket:id="entry">
			<form wicket:id="form">
				<div wicket:id="feedback"></div>
				<div wicket:id="player"></div>
				<button wicket:id="save">Save my score</button>
			</form>
		</div>
		<p wicket:id="saved"></p>
	</div>
</wicket:panel>
</body>
</html>
