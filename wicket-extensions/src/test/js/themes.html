<html>

<head>
	<title id="titleId">Wicket themes of the components tests</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<link rel="stylesheet" href="/wicket-core/src/test/js/qunit/qunit.css" type="text/css" media="screen" />
	<!-- the style sheets under test -->
	<link rel="stylesheet" href="/wicket-extensions/src/main/java/org/apache/wicket/extensions/theme/wicket-theme.css" type="text/css" />
	<link rel="stylesheet" href="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/modal/theme/theme.css" type="text/css" />
	<link rel="stylesheet" href="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/autocomplete/wicket-autocomplete-theme.css" type="text/css" />
	<link rel="stylesheet" href="/wicket-extensions/src/main/java/org/apache/wicket/extensions/markup/html/tabs/wicket-tabs.css" type="text/css" />
	<link rel="stylesheet" href="/wicket-extensions/src/main/java/org/apache/wicket/extensions/markup/html/progress/wicket-progress-bar.css" type="text/css" />
	<style>
		.my-theme { --wicket-theme-primary: #8e24aa; --wicket-theme-on-primary: #ffffff; }
	</style>
</head>

<body>
	<div id="qunit"></div>

	<div id="qunit-fixture">
		<div id="themed" class="wicket-theme wicket-theme-dark">
			<div class="dialog-theme-default"><div class="modal-dialog-overlay"><div class="modal-dialog"><h1 class="modal-dialog-header">Header</h1><div class="modal-dialog-footer">Footer</div></div></div></div>
			<input type="text" id="themedField"/>
			<div class="wicket-tabs wicket-tabs-pills"><wicket:panel><div class="tab-row"><ul><li class="selected"><a href="#">One</a></li><li><a href="#">Two</a></li></ul></div><div class="tab-panel">Panel</div></wicket:panel></div>
		</div>
		<div id="plain">
			<div class="dialog-theme-default"><div class="modal-dialog-overlay"><div class="modal-dialog"><h1 class="modal-dialog-header">Header</h1></div></div></div>
			<input type="text" id="plainField"/>
			<div class="wicket-tabs wicket-tabs-pills"><div class="tab-row"><ul><li class="selected"><a href="#">One</a></li></ul></div></div>
		</div>
		<div id="custom" class="wicket-theme my-theme">
			<div class="dialog-theme-default"><div class="modal-dialog-overlay"><div class="modal-dialog"><h1 class="modal-dialog-header">Header</h1></div></div></div>
		</div>
		<div id="upload"><div id="uploadBar"><div class="wicket-progress-bar"><progress class="wicket-progress-bar-value" max="100" value="0">0%</progress><span class="wicket-progress-bar-label" aria-hidden="true">0%</span></div></div><div id="uploadStatus"></div></div>
	</div>

	<script>
		// version lies between question mark and first ampersand (or end).
		// 'vanilla' (themes.html?vanilla) selects the jQuery-free wicket-ajax.js
		// engine instead of the default JQuery + wicket-ajax-jquery.js combination
		// (themes.html?4.0.0, themes.html?3.7.1, ...).
		var version = location.search.match(/\?(.*?)(&|$)/)[1];
		var useVanilla = (version === 'vanilla');

		if (!useVanilla) {
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/resource/jquery/jquery-"+version+".js'></scr"+"ipt>");
		}
	</script>
	<script>
		if (!useVanilla) {
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/ajax/res/js/wicket-ajax-jquery.js'></scr"+"ipt>");
		} else {
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/ajax/res/js/wicket-ajax.js'></scr"+"ipt>");
		}
	</script>
	<script type="text/javascript" src="/wicket-core/src/test/js/qunit/qunit.js"></script>

	<!-- the scripts under test -->
	<script type="text/javascript" src="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/autocomplete/wicket-autocomplete.js"></script>
	<script type="text/javascript" src="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/form/upload/progressbar.js"></script>

	<script type="text/javascript" src="themes-test.js"></script>
</body>
</html>
