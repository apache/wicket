<html>

<head>
	<title id="titleId">Wicket.Palette JavaScript tests</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<link rel="stylesheet" href="/wicket-core/src/test/js/qunit/qunit.css" type="text/css" media="screen" />
</head>

<body>
	<div id="qunit"></div>

	<div id="qunit-fixture">
		<select id="paletteChoices" multiple="multiple">
			<option value="4">four</option>
		</select>
		<select id="paletteSelection" multiple="multiple">
			<option value="1">one</option>
			<option value="2">two</option>
			<option value="3">three</option>
		</select>
		<input type="hidden" id="paletteRecorder" value="1,2,3"/>
	</div>

	<script>
		// version lies between question mark and first ampersand (or end)
		var version = location.search.match(/\?(.*?)(&|$)/)[1];

		document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/resource/jquery/jquery-"+version+".js'></scr"+"ipt>");
	</script>
	<script type="text/javascript" src="/wicket-core/src/test/js/qunit/qunit.js"></script>

	<!-- the module under test -->
	<script type="text/javascript" src="/wicket-extensions/src/main/java/org/apache/wicket/extensions/markup/html/form/palette/palette.js"></script>

	<script type="text/javascript" src="palette-test.js"></script>
</body>
</html>
