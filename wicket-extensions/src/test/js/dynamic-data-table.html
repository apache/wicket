<html>

<head>
	<title id="titleId">Wicket.DynamicDataTable JavaScript tests</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<link rel="stylesheet" href="/wicket-core/src/test/js/qunit/qunit.css" type="text/css" media="screen" />
	<link rel="stylesheet" href="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/repeater/data/table/dynamic/dynamic-data-table.css" type="text/css" />
</head>

<body>
	<div id="qunit"></div>

	<div id="qunit-fixture">
		<table id="dynamicTable">
			<thead><tr><th>Name</th><th>Actions</th></tr></thead>
			<tbody></tbody>
		</table>
	</div>

	<script>
		// version lies between question mark and first ampersand (or end).
		// 'vanilla' (dynamic-data-table.html?vanilla) selects the jQuery-free wicket-ajax.js
		// engine instead of the default JQuery + wicket-ajax-jquery.js combination
		// (dynamic-data-table.html?4.0.0, ...).
		var version = location.search.match(/\?(.*?)(&|$)/)[1];
		var useVanilla = (version === 'vanilla');

		if (!useVanilla) {
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/resource/jquery/jquery-"+version+".js'></scr"+"ipt>");
		}
	</script>
	<script>
		if (!useVanilla) {
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/ajax/res/js/wicket-ajax-jquery.js'></scr"+"ipt>");
		} else {
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/ajax/res/js/wicket-ajax.js'></scr"+"ipt>");
		}
	</script>
	<script type="text/javascript" src="/wicket-core/src/test/js/qunit/qunit.js"></script>

	<!-- the module under test -->
	<script type="text/javascript" src="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/repeater/data/table/dynamic/dynamic-data-table.js"></script>
	<script type="text/javascript" src="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/repeater/data/table/dynamic/handlebars-adapter.js"></script>

	<script type="text/javascript" src="dynamic-data-table-test.js"></script>
</body>
</html>
