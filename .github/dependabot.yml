version: 2
updates:

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 50

  - package-ecosystem: "npm"
    directory: "/testing/wicket-js-tests/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 20

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"

  # The maintenance lines get minor and patch updates only: a new major
  # version of a dependency is a change for the next Wicket major. Jakarta
  # specification APIs get patch updates only, because their minor version
  # marks the Jakarta EE release the line is built against.

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "wicket-11.x"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jakarta.servlet*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jakarta.websocket*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jakarta.el*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jakarta.enterprise*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jakarta.validation*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/testing/wicket-js-tests/"
    target-branch: "wicket-11.x"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "wicket-11.x"
    schedule:
      interval: "weekly"
      day: "sunday"

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "wicket-10.x"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2.7.9 brings a closure-compiler built for Java 21; wicket-10.x still builds on Java 17.
      - dependency-name: "org.primefaces.extensions:resources-optimizer-maven-plugin"
        versions: [">= 2.7.9"]
      - dependency-name: "jakarta.servlet*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jakarta.websocket*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jakarta.el*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jakarta.enterprise*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jakarta.validation*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/testing/wicket-js-tests/"
    target-branch: "wicket-10.x"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "wicket-10.x"
    schedule:
      interval: "weekly"
      day: "sunday"
