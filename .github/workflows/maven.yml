name: Java CI

on:
  push:
    branches: [ wicket-10.x ]
  pull_request:
    branches: [ wicket-10.x ]

env:
  MAVEN_VERSION: 3.9.9

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java:
        - '17'
        - '21'
        - '25'

    steps:
    - uses: actions/checkout@v6

    - name: Setup Temurin JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    # Puppeteer brings its own Chrome; only Chrome's shared libraries are needed here.
    - name: Install headless Chrome's dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates \
          fonts-freefont-ttf \
          fonts-ipafont-gothic \
          fonts-kacst \
          fonts-liberation \
          fonts-thai-tlwg \
          fonts-wqy-zenhei \
          libasound2t64 \
          libatk-bridge2.0-0t64 \
          libatk1.0-0t64 \
          libc6 \
          libcairo2 \
          libcups2t64 \
          libdbus-1-3 \
          libdrm2 \
          libexpat1 \
          libgbm1 \
          libglib2.0-0t64 \
          libgtk-3-0t64 \
          libnspr4 \
          libnss3 \
          libpango-1.0-0 \
          libvulkan1 \
          libx11-6 \
          libxcb1 \
          libxcomposite1 \
          libxdamage1 \
          libxext6 \
          libxfixes3 \
          libxkbcommon0 \
          libxrandr2 \
          xdg-utils

    - name: Install Maven
      run: |
        wget --retry-connrefused --tries=5 --waitretry=5 --read-timeout=20 --timeout=15 https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz
        tar -xzf apache-maven-${MAVEN_VERSION}-bin.tar.gz

    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: |
        java -version
        ./apache-maven-${MAVEN_VERSION}/bin/mvn --show-version clean verify -Pjs-test
