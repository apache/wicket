<html>

<head>
	<title>Trusted Types JavaScript tests</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">

	<!-- rendered by Wicket when the CSP of the application allows the policy 'wicket' -->
	<meta name="wicket-trusted-types" content="wicket">

	<script>
		// version lies between question mark and first ampersand (or end).
		// 'vanilla' (trusted-types.html?vanilla) selects the jQuery-free wicket-ajax.js
		// engine instead of the default JQuery + wicket-ajax-jquery.js combination
		// (trusted-types.html?4.0.0). document.write() is refused once the policy
		// below is in force, so the engine is chosen before it.
		var version = location.search.match(/\?(.*?)(&|$)/)[1];
		var useVanilla = (version === 'vanilla');

		if (!useVanilla) {
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/resource/jquery/jquery-"+version+".js'></scr"+"ipt>");
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/ajax/res/js/wicket-ajax-jquery.js'></scr"+"ipt>");
		} else {
			document.write("<scr"+"ipt src='/wicket-core/src/main/java/org/apache/wicket/ajax/res/js/wicket-ajax.js'></scr"+"ipt>");
		}
	</script>

	<meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'; trusted-types wicket">
</head>

<body>
	<!-- no id="qunit" element: the HTML reporter of QUnit writes strings to innerHTML -->

	<div id="qunit-fixture">
		<div id="componentToReplace">old body</div>
		<table><tbody><tr id="rowToReplace"><td>old cell</td></tr></tbody></table>
		<div id="withTextAfter">old body</div>
		<div id="withScripts">old body</div>
		<div id="withJQueryData"><span>old body</span></div>
		<ul id="addTo"></ul>
		<ul id="addToWithScripts"></ul>

		<input type="text" id="autoComplete"/>

		<div id="uploadStatus"></div>

		<table><tbody id="uploadList"></tbody></table>
	</div>

	<script type="text/javascript" src="/wicket-core/src/test/js/qunit/qunit.js"></script>

	<!-- the modules under test -->
	<script type="text/javascript" src="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/autocomplete/wicket-autocomplete.js"></script>
	<script type="text/javascript" src="/wicket-extensions/src/main/java/org/apache/wicket/extensions/ajax/markup/html/form/upload/progressbar.js"></script>
	<script type="text/javascript" src="/wicket-core/src/main/java/org/apache/wicket/markup/html/form/upload/MultiFileUploadField.js"></script>

	<script type="text/javascript" src="trusted-types.js"></script>
</body>
</html>
